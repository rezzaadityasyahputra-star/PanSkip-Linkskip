<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanSkip - Loading</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Fullscreen Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Glowing Blue Pill / Box Button */
        .pill-btn-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pill-btn-blue:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 38px rgba(59, 130, 246, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .pill-btn-blue:active {
            transform: translateY(0) scale(0.98);
        }

        /* Progress Bar Glow */
        .progress-glow {
            background: linear-gradient(90deg, #2563eb 0%, #60a5fa 100%);
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.8);
            transition: width 0.08s linear;
        }

        /* Entrance & Morph Animations */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes boxExpand {
            0% {
                opacity: 0;
                transform: scale(0.6) translateY(12px);
                border-radius: 9999px;
            }
            60% {
                opacity: 1;
                transform: scale(1.04) translateY(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                border-radius: 1.5rem;
            }
        }

        .animate-entrance {
            animation: fadeInScale 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-box-appear {
            animation: boxExpand 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .fade-out-up {
            opacity: 0 !important;
            transform: translateY(-10px) scale(0.96);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center relative selection:bg-blue-500/30 selection:text-blue-200">

    <!-- Fullscreen Animated White Dots Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Center Content -->
    <main class="relative z-10 w-full max-w-md px-6 flex flex-col items-center justify-center text-center">
        
        <!-- Brand Text (No Logo) -->
        <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mb-8 animate-entrance drop-shadow-[0_0_20px_rgba(59,130,246,0.5)]">
            Pan<span class="text-blue-400">Skip</span>
        </h1>

        <!-- Loading Section -->
        <div id="loading-container" class="w-full animate-entrance" style="animation-delay: 0.1s;">
            <!-- Percentage Display -->
            <div class="flex items-center justify-between text-xs sm:text-sm font-medium text-gray-400 mb-2.5 px-1">
                <span>Memuat sistem...</span>
                <span id="percent-text" class="text-blue-400 font-semibold tabular-nums">0%</span>
            </div>

            <!-- Horizontal Loading Bar -->
            <div class="w-full h-2.5 bg-white/10 rounded-full overflow-hidden border border-white/10 backdrop-blur-sm p-[1px]">
                <div id="progress-bar" class="h-full w-0 rounded-full progress-glow"></div>
            </div>
        </div>

        <!-- Continue Box / Button (Appears after 100%) -->
        <div id="continue-container" class="hidden w-full flex justify-center mt-2">
            <div class="w-full bg-white/[0.04] backdrop-blur-xl border border-white/15 rounded-3xl p-6 shadow-[0_20px_50px_rgba(0,0,0,0.85)] animate-box-appear">
                <p class="text-xs sm:text-sm text-gray-400 mb-4">Siap digunakan</p>
                <a 
                    href="home.html" 
                    class="w-full py-3.5 px-6 rounded-2xl pill-btn-blue text-white font-semibold text-sm sm:text-base flex items-center justify-center gap-2.5 cursor-pointer"
                >
                    <span>Lanjutkan</span>
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // 1. Animated White Dots Canvas Background
        // ==========================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 75;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.55;
                this.vy = (Math.random() - 0.5) * 0.55;
                this.radius = Math.random() * 1.8 + 0.6;
                this.alpha = Math.random() * 0.6 + 0.25;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 110) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 * (1 - dist / 110)})`;
                        ctx.lineWidth = 0.6;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        // ==========================================
        // 2. Horizontal Loading & Transition Logic
        // ==========================================
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent-text');
        const loadingContainer = document.getElementById('loading-container');
        const continueContainer = document.getElementById('continue-container');

        function startLoading() {
            let progress = 0;
            const interval = setInterval(() => {
                // Smooth random increment
                const step = Math.floor(Math.random() * 5) + 1;
                progress = Math.min(progress + step, 100);

                progressBar.style.width = `${progress}%`;
                percentText.textContent = `${progress}%`;

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingContainer.classList.add('fade-out-up');
                        setTimeout(() => {
                            loadingContainer.classList.add('hidden');
                            continueContainer.classList.remove('hidden');
                        }, 380);
                    }, 300);
                }
            }, 45);
        }

        window.onload = function () {
            resizeCanvas();
            initParticles();
            animateParticles();
            startLoading();
        };
    </script>
</body>
</html>
