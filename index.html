<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanSkip - Premium Link Bypass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        // ==========================================
        // CONFIGURATION & LOGO LINK (DI TARUH PALING ATAS)
        // ==========================================
        const PANSKIP_LOGO_URL = "https://i.ibb.co.com/21N6fcLQ/image.png";
        const ADMIN_WHATSAPP_NUMBER = "6283116920767"; // Nomor WhatsApp Admin

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    animation: {
                        'bounce-slow': 'bounce 3s linear infinite',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        * { transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s ease, opacity 0.3s ease; }
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark .glass { background: rgba(15, 23, 42, 0.5); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-900 dark:to-zinc-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden select-none">

    <header class="w-full fixed top-0 left-0 z-40 px-6 py-4 flex items-center justify-between">
        <button id="menuBtn" class="w-10 h-10 rounded-full flex items-center justify-center bg-white dark:bg-slate-800 shadow-md hover:scale-110 active:scale-95 text-xl relative z-50">
            <i class="fa-solid fa-ellipsis-vertical text-emerald-500 transition-transform duration-300"></i>
        </button>

        <div class="absolute left-1/2 transform -translate-x-1/2 text-2xl font-bold tracking-wider uppercase">
            <span class="text-emerald-500">Pan</span><span class="text-slate-700 dark:text-white">Skip</span>
        </div>
        <div class="w-10"></div>
    </header>

    <div id="sidebar" class="fixed top-0 left-0 h-full w-80 z-40 glass border-r border-white/20 dark:border-slate-700/50 transform -translate-x-full transition-transform duration-500 ease-out p-5 pt-24 shadow-2xl flex flex-col justify-between overflow-y-auto">
        
        <div class="space-y-6">
            <div class="text-center border-b border-slate-300 dark:border-slate-700 pb-3">
                <h2 class="text-lg font-bold uppercase tracking-widest text-emerald-500"><i class="fa-solid fa-gauge-high mr-2"></i>PanSkip Menu</h2>
            </div>

            <div class="space-y-3">
                <button onclick="showAlert('Apa itu PanSkip?', 'PanSkip adalah platform modern yang membantu melewati halaman shortlink yang menyebalkan, penuh iklan, dan berputar-putar secara otomatis tanpa ribet.')" class="w-full py-2.5 px-4 rounded-xl flex items-center gap-3 bg-white/50 dark:bg-slate-800/50 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-sm font-medium shadow-sm active:scale-95">
                    <i class="fa-solid fa-circle-info w-5 text-center text-base"></i> Apa itu PanSkip?
                </button>

                <button onclick="showAlert('Tata Cara Menggunakan', '1. Tempelkan link tautan pendek Anda pada kolom input di halaman depan.\n2. Klik tombol \'Bypass Link Now\'.\n3. Tunggu sistem bekerja, dan link tujuan asli Anda akan langsung muncul tanpa iklan!')" class="w-full py-2.5 px-4 rounded-xl flex items-center gap-3 bg-white/50 dark:bg-slate-800/50 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-sm font-medium shadow-sm active:scale-95">
                    <i class="fa-solid fa-book-open w-5 text-center text-base"></i> Tata Cara Menggunakan
                </button>

                <a href="https://pandow-aio.vercel.app/" target="_blank" class="w-full py-2.5 px-4 rounded-xl flex items-center gap-3 bg-white/50 dark:bg-slate-800/50 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-sm font-medium shadow-sm active:scale-95">
                    <i class="fa-solid fa-cloud-arrow-down w-5 text-center text-base"></i> PanDow
                </a>

                <a id="msgAdminBtn" href="#" target="_blank" class="w-full py-2.5 px-4 rounded-xl flex items-center gap-3 bg-white/50 dark:bg-slate-800/50 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 text-sm font-medium shadow-sm active:scale-95">
                    <i class="fa-solid fa-user-shield w-5 text-center text-base"></i> Message Admin
                </a>
            </div>

            <div class="border-t border-slate-300 dark:border-slate-700 pt-4 space-y-2">
                <div class="text-xs font-bold uppercase tracking-wider text-emerald-500 mb-1"><i class="fa-solid fa-paper-plane mr-1"></i> Send Your Chat</div>
                <form id="chatForm" class="flex flex-col gap-2">
                    <input type="text" id="messageInput" placeholder="Masukkan text disini..." required 
                           class="w-full px-3 py-2 bg-white/70 dark:bg-slate-800/70 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs text-slate-800 dark:text-white">
                    <button type="submit" id="sendBtn" class="w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg shadow-md flex items-center justify-center gap-2 active:scale-95">
                        <span>Kirim Ke Admin</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>
                    </button>
                </form>
            </div>
        </div>

        <div class="border-t border-slate-300 dark:border-slate-700 pt-4 mt-4">
            <button id="themeToggle" class="w-full py-2.5 px-4 rounded-xl flex items-center justify-between bg-white dark:bg-slate-800 shadow-md text-xs font-semibold hover:scale-[1.02] active:scale-95">
                <span id="themeText">Dark Mode</span>
                <i id="themeIcon" class="fa-solid fa-moon text-sm text-emerald-500"></i>
            </button>
        </div>
    </div>

    <div id="overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-30 hidden opacity-0 transition-opacity duration-500"></div>

    <main class="flex-grow flex flex-col items-center justify-center p-6 mt-12">
        <div class="w-full max-w-md text-center space-y-6">
            
            <div class="relative inline-block animate-bounce-slow">
                <div class="absolute inset-0 bg-emerald-500/20 rounded-full blur-2xl animate-pulse-slow"></div>
                <img id="mainLogo" src="" alt="PanSkip Logo" class="w-36 h-36 object-contain relative z-10 drop-shadow-[0_8px_12px_rgba(16,185,129,0.25)]">
            </div>

            <div class="glass border border-white/20 dark:border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
                <div class="text-left">
                    <h3 class="text-sm font-bold uppercase tracking-wider text-emerald-500"><i class="fa-solid fa-bolt mr-2"></i>Bypass Link Engine</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Tempel tautan safelink/shortlink iklan Anda di bawah.</p>
                </div>

                <div class="space-y-3">
                    <input type="url" id="bypassInput" placeholder="https://link2unlock.com/..." required
                           class="w-full px-4 py-3 bg-white/80 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm text-slate-800 dark:text-white">
                    
                    <button onclick="processBypass()" id="bypassBtn" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 active:scale-95">
                        <span>Bypass Link Now</span> <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </button>
                </div>

                <div id="resultBox" class="hidden p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-left space-y-2 animate-pulse-slow">
                    <span class="text-xs font-bold text-emerald-500 uppercase block"><i class="fa-solid fa-square-check mr-1"></i> Success Unlocked:</span>
                    <a id="resultUrl" href="#" target="_blank" class="text-sm text-emerald-400 underline font-medium break-all block hover:text-emerald-300"></a>
                </div>
            </div>

        </div>
    </main>

    <div id="customModal" class="fixed inset-0 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 max-w-sm w-full p-6 rounded-2xl shadow-2xl transform scale-90 transition-transform duration-300">
            <h3 id="modalTitle" class="text-lg font-bold text-emerald-500 mb-2"></h3>
            <p id="modalBody" class="text-sm text-slate-600 dark:text-zinc-300 whitespace-pre-line leading-relaxed mb-5"></p>
            <button onclick="closeModal()" class="w-full py-2 bg-slate-200 dark:bg-slate-700 font-semibold rounded-xl text-sm hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-500">Dimengerti</button>
        </div>
    </div>

    <script>
        // Set Link Logo & Link Message Admin Terintegrasi
        document.getElementById('mainLogo').src = PANSKIP_LOGO_URL;
        document.getElementById('msgAdminBtn').href = `https://wa.me/${ADMIN_WHATSAPP_NUMBER}`;

        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuIcon = menuBtn.querySelector('i');
        
        // INTERAKSI MENU SIDEBAR
        let isSidebarOpen = false;
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
                menuIcon.classList.replace('fa-ellipsis-vertical', 'fa-xmark');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                menuIcon.classList.replace('fa-xmark', 'fa-ellipsis-vertical');
                setTimeout(() => overlay.classList.add('hidden'), 500);
            }
        }
        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // FITUR DARK / LIGHT MODE
        const themeToggle = document.getElementById('themeToggle');
        const themeText = document.getElementById('themeText');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeText.textContent = 'Light Mode';
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeText.textContent = 'Dark Mode';
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'dark');
            }
        });
        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
            themeText.textContent = 'Light Mode';
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // CUSTOM MODAL POPUP
        const customModal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        function showAlert(title, text) {
            modalTitle.textContent = title;
            modalBody.textContent = text;
            customModal.classList.remove('hidden');
            setTimeout(() => {
                customModal.classList.add('opacity-100');
                customModal.querySelector('div').classList.replace('scale-90', 'scale-100');
            }, 10);
        }
        function closeModal() {
            customModal.classList.remove('opacity-100');
            customModal.querySelector('div').classList.replace('scale-100', 'scale-90');
            setTimeout(() => customModal.classList.add('hidden'), 300);
        }

        // INTEGRASI API ENGINE BYPASS PANSKIP (HOME)
        async function processBypass() {
            const inputUrl = document.getElementById('bypassInput').value.trim();
            const bypassBtn = document.getElementById('bypassBtn');
            const resultBox = document.getElementById('resultBox');
            const resultUrl = document.getElementById('resultUrl');

            if (!inputUrl) {
                showAlert('Input Kosong ⚠️', 'Masukkan URL shortlink terlebih dahulu.');
                return;
            }

            bypassBtn.disabled = true;
            bypassBtn.innerHTML = `<span>Processing...</span> <i class="fa-solid fa-circle-notch animate-spin"></i>`;
            resultBox.classList.add('hidden');

            try {
                const encodedUrl = encodeURIComponent(inputUrl);
                const response = await fetch(`https://api-nanzz.my.id/docs/api/tools/skip-link.php?url=${encodedUrl}`);
                const data = await response.json();

                if (data.status && data.result.destination_url) {
                    resultUrl.href = data.result.destination_url;
                    resultUrl.textContent = data.result.destination_url;
                    resultBox.classList.remove('hidden');
                    showAlert('Sukses Terbuka! 🎉', 'Safelink berhasil dilewati, silakan periksa kotak hasil di bawah tombol.');
                } else {
                    showAlert('Gagal Bypass ❌', 'Tautan tidak didukung oleh sistem API saat ini.');
                }
            } catch (error) {
                showAlert('API Error ❌', 'Gagal terhubung ke server API Skipper, coba lagi nanti.');
            } finally {
                bypassBtn.disabled = false;
                bypassBtn.innerHTML = `<span>Bypass Link Now</span> <i class="fa-solid fa-wand-magic-sparkles"></i>`;
            }
        }

        // PERBAIKAN FITUR SEND CHAT: OTOMATIS REDIRECT KE WHATSAPP PENGGUNA
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const pesan = messageInput.value.trim();
            
            if (pesan) {
                // Encode teks agar aman dibaca oleh URL WhatsApp
                const teksFormat = encodeURIComponent(`Halo Admin PanSkip, ada pesan baru:\n\n"${pesan}"`);
                // Membuka tab baru otomatis menggunakan nomor sender masing-masing menuju WA Admin
                window.open(`https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${teksFormat}`, '_blank');
                // Mengosongkan form input kembali
                messageInput.value = '';
            }
        });
    </script>
</body>
</html>
