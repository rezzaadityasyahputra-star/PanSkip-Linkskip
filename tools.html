<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanSkip - Tools</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Animated Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Entrance Animation */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-entrance {
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-blue-500/30 selection:text-blue-200">

    <!-- Animated White Dots Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Top-Right Header: Logo + PanSkip -->
    <header class="fixed top-4 right-4 sm:top-6 sm:right-8 z-30 flex items-center gap-3 px-4 py-2 rounded-full bg-white/5 backdrop-blur-md border border-white/10 shadow-lg">
        <!-- Logo Image with SVG Fallback -->
        <div class="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center bg-blue-500/20 border border-blue-400/30">
            <img 
                src="skip.png" 
                alt="PanSkip Logo" 
                class="w-full h-full object-cover"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >
            <div class="hidden w-full h-full items-center justify-center text-blue-400">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
        </div>
        <span class="text-lg sm:text-xl font-bold tracking-tight text-white drop-shadow-[0_0_10px_rgba(59,130,246,0.6)]">
            Pan<span class="text-blue-400">Skip</span>
        </span>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 flex-1 flex flex-col items-center px-4 pt-20 pb-28">
        <!-- Judul di Tengah Atas -->
        <div class="w-full text-center animate-entrance">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white drop-shadow-[0_0_12px_rgba(59,130,246,0.4)]">
                Tools
            </h1>
        </div>

        <!-- Teks di Tengah Bawahnya -->
        <div class="flex-1 flex items-center justify-center w-full animate-entrance">
            <p class="text-sm sm:text-base text-gray-400 text-center">
                Daftar tools belum tersedia
            </p>
        </div>
    </main>

    <!-- Bottom Floating Navbar -->
    <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-30 w-[90%] max-w-sm">
        <div class="flex items-center justify-around px-3 py-2.5 rounded-full bg-white/[0.06] backdrop-blur-xl border border-white/15 shadow-[0_10px_35px_rgba(0,0,0,0.9)]">
            
            <!-- Home Link -->
            <a href="home.html" class="group flex items-center gap-2 px-4 py-2 rounded-full text-gray-300 hover:text-white hover:bg-blue-500/20 transition-all duration-200">
                <svg class="w-5 h-5 text-blue-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="text-xs sm:text-sm font-medium">Home</span>
            </a>

            <!-- Chating Link -->
            <a href="chating.html" class="group flex items-center gap-2 px-4 py-2 rounded-full text-gray-300 hover:text-white hover:bg-blue-500/20 transition-all duration-200">
                <svg class="w-5 h-5 text-blue-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span class="text-xs sm:text-sm font-medium">Chating</span>
            </a>

            <!-- Tools Link (Active) -->
            <a href="tools.html" class="group flex items-center gap-2 px-4 py-2 rounded-full text-white bg-blue-500/20 border border-blue-500/30 transition-all duration-200">
                <svg class="w-5 h-5 text-blue-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                </svg>
                <span class="text-xs sm:text-sm font-medium">Tools</span>
            </a>

        </div>
    </nav>

    <!-- Particle Animation -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 75;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.55;
                this.vy = (Math.random() - 0.5) * 0.55;
                this.radius = Math.random() * 1.8 + 0.6;
                this.alpha = Math.random() * 0.6 + 0.25;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 110) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 * (1 - dist / 110)})`;
                        ctx.lineWidth = 0.6;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        window.onload = function () {
            resizeCanvas();
            initParticles();
            animateParticles();
        };
    </script>
</body>
</html>
