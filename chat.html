<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- FAVICON & TAB ICON -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/nqPTyK8G/image.png" />
  <link rel="apple-touch-icon" href="https://i.ibb.co.com/nqPTyK8G/image.png" />

  <title>PanChat — Live Group Community</title>
  <meta name="description" content="Komunitas Live Chat Group PanSkip - Mengobrol secara real-time dengan seluruh pengguna secara aman dan cepat." />
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
              950: '#052e16',
            },
            dark: {
              base: '#0b0f17',
              card: '#111827',
              border: '#1f2937',
            }
          },
          boxShadow: {
            'glow': '0 0 25px -5px rgba(34, 197, 94, 0.4)',
            'glow-lg': '0 0 50px -10px rgba(34, 197, 94, 0.3)',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & Supabase SDK -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    button, a, input, [role="button"] {
      -webkit-tap-highlight-color: transparent !important;
      user-select: none;
    }
    button:focus, input:focus { outline: none; }
    button:active { transform: scale(0.97); }

    .glass-header {
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Custom Scrollbar */
    #chat-box::-webkit-scrollbar {
      width: 6px;
    }
    #chat-box::-webkit-scrollbar-track {
      background: #0b0f17;
    }
    #chat-box::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 10px;
    }
    #chat-box::-webkit-scrollbar-thumb:hover {
      background: #22c55e;
    }
  </style>
</head>
<body class="bg-dark-base text-gray-100 font-sans antialiased h-screen flex flex-col justify-between overflow-hidden">

  <!-- MODAL NOTIFIKASI / SET NAMA SEBELUM CHAT -->
  <div id="name-modal" class="fixed inset-0 z-[100] bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full p-6 sm:p-8 rounded-2xl border border-brand-500/30 text-center relative shadow-2xl">
      <div class="w-16 h-16 rounded-2xl bg-brand-500/10 border border-brand-500/20 text-brand-400 flex items-center justify-center mx-auto mb-5 shadow-glow">
        <i data-lucide="message-square" class="w-8 h-8"></i>
      </div>
      
      <h3 class="text-xl sm:text-2xl font-extrabold text-white mb-2">Selamat Datang di PanChat!</h3>
      <p class="text-xs sm:text-sm text-gray-400 leading-relaxed mb-6">
        Sebelum bergabung ke dalam ruang obrolan obrolan grup global, masukkan nama kamu terlebih dahulu.
      </p>

      <form id="name-form" class="space-y-4">
        <div class="text-left">
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">Nama Kamu / Username</label>
          <input 
            type="text" 
            id="user-display-name" 
            required 
            placeholder="Contoh: Rezza Aditya" 
            class="w-full px-4 py-3 bg-dark-base/90 border border-gray-700 rounded-xl text-white text-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
          >
        </div>

        <button 
          type="submit" 
          class="sound-btn w-full py-3.5 px-6 bg-brand-500 hover:bg-brand-600 active:scale-95 text-dark-base font-extrabold text-sm rounded-xl shadow-glow hover:shadow-glow-lg transition-all duration-200 flex items-center justify-center gap-2"
        >
          <span>Mulailah Obrolan</span>
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- HEADER NAVBAR CHAT -->
  <header class="glass-header border-b border-white/5 py-3 px-4 sm:px-8 flex items-center justify-between shrink-0 z-40">
    <div class="flex items-center gap-3">
      <a href="index.html" class="sound-btn p-2 rounded-xl bg-dark-card border border-gray-800 text-gray-300 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      
      <div class="w-10 h-10 rounded-xl overflow-hidden border border-brand-500/30 bg-dark-card flex items-center justify-center shadow-glow">
        <img src="https://i.ibb.co.com/nqPTyK8G/image.png" alt="PanSkip Logo" class="w-full h-full object-cover" />
      </div>

      <div>
        <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-white flex items-center gap-2">
          Pan<span class="text-brand-400">Chat</span> Global
        </h1>
        <p id="online-status-text" class="text-[11px] text-brand-400 font-semibold flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-brand-400 animate-pulse"></span>
          <span>Menghubungkan...</span>
        </p>
      </div>
    </div>

    <!-- NAMA LENGKAP USER YANG AKTIF -->
    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-dark-card border border-gray-800 text-xs">
      <span class="text-gray-400">Kamu:</span>
      <span id="active-user-name" class="font-bold text-emerald-400">Belum Set</span>
    </div>
  </header>

  <!-- KOTAK PESAN LIVE CHAT -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 bg-dark-base relative">
    <div class="text-center my-6 text-xs text-gray-500">
      <span class="px-3 py-1 rounded-full bg-dark-card border border-gray-800">Pesan disebarkan secara instan dan aman. Selamat mengobrol!</span>
    </div>
  </main>

  <!-- FOOTER INPUT PESAN -->
  <footer class="glass-header border-t border-white/5 p-3 sm:p-4 shrink-0 z-40">
    <form id="chat-form" class="max-w-5xl mx-auto flex gap-2 sm:gap-3 items-center">
      <input 
        type="text" 
        id="chat-input" 
        disabled
        placeholder="Isi nama dulu untuk mulai mengobrol..." 
        required 
        autocomplete="off"
        class="flex-1 px-4 py-3 sm:py-3.5 bg-dark-card/80 border border-gray-700/80 rounded-xl text-white text-sm placeholder-gray-500 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all disabled:opacity-50"
      >
      <button 
        type="submit" 
        id="btn-send"
        disabled
        class="sound-btn px-5 sm:px-6 py-3 sm:py-3.5 bg-brand-500 hover:bg-brand-600 active:scale-95 text-dark-base font-extrabold text-sm rounded-xl shadow-glow hover:shadow-glow-lg transition-all flex items-center justify-center gap-2 shrink-0 disabled:opacity-50"
      >
        <span class="hidden sm:inline">Kirim</span>
        <i data-lucide="send" class="w-4 h-4"></i>
      </button>
    </form>
  </footer>

  <!-- LOGIKA JAVASCRIPT DETAILED & REALTIME -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. INISIALISASI SUPABASE SDK DENGAN KREDENSIAL LENGKAP
      const SUPABASE_URL = 'https://atgujhpouptqipcjchlm.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Z3VqaHBvdXB0cWlwY2pjaGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NzI0MzQsImV4cCI6MjEwNDQ0ODQzNH0.BsFpKqtj3sdsnHzJttT_2gDAxyul7ljou5FcU8SnUpc';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      lucide.createIcons();

      // SOUND EFFECT CLICK
      const playClickSound = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
        } catch (e) {}
      };

      document.querySelectorAll(".sound-btn").forEach((elem) => {
        elem.addEventListener("click", () => playClickSound());
      });

      // DOM ELEMENTS
      const nameModal = document.getElementById("name-modal");
      const nameForm = document.getElementById("name-form");
      const userDisplayNameInput = document.getElementById("user-display-name");
      const activeUserName = document.getElementById("active-user-name");
      const chatBox = document.getElementById("chat-box");
      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");
      const btnSend = document.getElementById("btn-send");
      const onlineStatusText = document.getElementById("online-status-text");

      let currentUserName = "";
      let currentUserId = "";

      // 2. CEK AUTO-FILL NAMA DARI SUPABASE SESSION
      async function autoCheckUser() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
          currentUserId = session.user.id;
          const { data: profile } = await supabase.from("profiles").select("full_name").eq("id", session.user.id).single();
          if (profile?.full_name) {
            userDisplayNameInput.value = profile.full_name;
          }
        } else {
          currentUserId = "guest_" + Math.random().toString(36).substr(2, 9);
        }
      }
      await autoCheckUser();

      // 3. KETIKA TOMBOL "MULAI OBROLAN" DIKLIK
      nameForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const inputName = userDisplayNameInput.value.trim();
        if (!inputName) return;

        currentUserName = inputName;
        activeUserName.textContent = currentUserName;

        // Sembunyikan Modal
        nameModal.classList.add("hidden");

        // Aktifkan Form Chat
        chatInput.disabled = false;
        btnSend.disabled = false;
        chatInput.placeholder = "Ketik pesan kamu di sini...";
        chatInput.focus();

        // Mulai Muat Pesan & Realtime Listener
        loadInitialMessages();
        initRealtimeChat();
      });

      // 4. SANITASI TEKS (MENCEGAH XSS)
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.innerText = text;
        return div.innerHTML;
      }

      // 5. RENDER BUBBLE CHAT KE LAYAR
      function renderMessage(msg) {
        const isMe = msg.sender_name === currentUserName;
        const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const msgWrapper = document.createElement("div");
        msgWrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

        msgWrapper.innerHTML = `
          <div class="max-w-[85%] sm:max-w-[65%] px-4 py-3 rounded-2xl text-xs sm:text-sm ${
            isMe 
              ? 'bg-brand-500 text-dark-base font-medium rounded-br-none shadow-glow' 
              : 'glass-card text-gray-100 rounded-bl-none'
          }">
            ${!isMe ? `<span class="block font-bold text-brand-400 text-[11px] mb-1">${escapeHtml(msg.sender_name)}</span>` : ''}
            <p class="leading-relaxed break-words">${escapeHtml(msg.message)}</p>
            <span class="block text-[10px] opacity-70 text-right mt-1 font-mono">${time}</span>
          </div>
        `;

        chatBox.appendChild(msgWrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // 6. AMBIL HISTORI CHAT LAMA DARI DATABASE
      async function loadInitialMessages() {
        const { data: messages, error } = await supabase
          .from("group_messages")
          .select("*")
          .order("created_at", { ascending: true })
          .limit(100);

        if (error) {
          console.error("Gagal memuat pesan:", error);
          return;
        }

        // Reset Chat Box kecuali pesan sambutan
        chatBox.innerHTML = `
          <div class="text-center my-6 text-xs text-gray-500">
            <span class="px-3 py-1 rounded-full bg-dark-card border border-gray-800">Pesan disebarkan secara instan dan aman. Selamat mengobrol!</span>
          </div>
        `;

        messages.forEach((msg) => renderMessage(msg));
      }

      // 7. KISAH/KIRIM PESAN BARU
      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;

        chatInput.value = ""; // Reset Input

        const { error } = await supabase
          .from("group_messages")
          .insert([
            {
              user_id: currentUserId.startsWith("guest_") ? null : currentUserId,
              sender_name: currentUserName,
              message: text
            }
          ]);

        if (error) {
          console.error("Gagal mengirim pesan:", error.message);
        }
      });

      // 8. SUBSCRIBER REALTIME & PRESENCE (ANGGOTA ONLINE)
      function initRealtimeChat() {
        const channel = supabase.channel("panchat-global");

        // Realtime Listener Pesan Baru
        channel.on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "group_messages" },
          (payload) => {
            renderMessage(payload.new);
          }
        );

        // Realtime Listener Jumlah User Online
        channel.on("presence", { event: "sync" }, () => {
          const userState = channel.presenceState();
          const count = Object.keys(userState).length;
          onlineStatusText.innerHTML = `
            <span class="w-2 h-2 rounded-full bg-brand-400 animate-pulse"></span>
            <span>${count} Anggota Online</span>
          `;
        });

        channel.subscribe(async (status) => {
          if (status === "SUBSCRIBED") {
            await channel.track({
              user_name: currentUserName,
              online_at: new Date().toISOString()
            });
          }
        });
      }
    });
  </script>
</body>
</html>
